<div class="auth-wrapper d-flex justify-content-center align-items-center">
  <div class="card shadow-sm" style="width: 100%; max-width: 400px;">
    <div class="card-body p-4">
      <h4 class="card-title text-center mb-4">BoardKeeper</h4>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" formControlName="email" />
          <div class="text-danger small" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
            A valid email is required.
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <input [type]="showPassword ? 'text' : 'password'" class="form-control" formControlName="password"/>
            <button type="button" class="btn btn-outline-secondary" (click)="showPassword = !showPassword" tabindex="-1">
              <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
          <div class="text-danger small" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
            Password is required.
          </div>
        </div>

        <div class="d-flex justify-content-end mb-3">
          <a routerLink="/forgot-password" class="small text-decoration-none">Forgot password?</a>
        </div>

          <div class="toast-container-fixed">
            <div class="toast show align-items-center toast-danger border-0 shadow-lg" role="alert" *ngIf="errorMessage">
              <div class="d-flex">
                <div class="toast-body">{{ errorMessage }}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="errorMessage = ''"></button>
              </div>
            </div>

            <div class="toast show align-items-center toast-success border-0 shadow-lg" role="alert" *ngIf="successMessage">
              <div class="d-flex">
                <div class="toast-body">{{ successMessage }}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="successMessage = ''"></button>
              </div>
            </div>
          </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="submitting">
          {{ submitting ? 'Logging in...' : 'Log In' }}
        </button>
      </form>

      <p class="text-center text-muted small mt-3 mb-0">
        Don't have an account? <a routerLink="/register">Register here</a>
      </p>
    </div>
  </div>
</div>
