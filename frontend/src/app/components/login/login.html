<div class="auth-wrapper d-flex justify-content-center align-items-center">
  <div class="card shadow-sm" style="width: 100%; max-width: 400px;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <div class="d-flex align-items-center justify-content-center gap-2 mb-1">
          <i class="bi bi-shield-fill-check fs-3 text-primary"></i>
          <h4 class="card-title fw-bold mb-0">BoardKeeper</h4>
        </div>
        <p class="text-muted small mb-0">Sign in to your account</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" formControlName="email"/>
          <div class="text-danger small" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
            A valid email is required.
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <input [type]="showPassword ? 'text' : 'password'" class="form-control border-end-0" formControlName="password"/>
            <button type="button" class="btn border border-start-0 bg-transparent text-secondary" (click)="showPassword = !showPassword" tabindex="-1">
              <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
          <div class="text-danger small" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
            Password is required.
          </div>
        </div>

        <div class="d-flex justify-content-end mb-3">
          <a routerLink="/forgot-password" class="small text-decoration-none">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="submitting || form.invalid">
          {{ submitting ? 'Logging in...' : 'Log In' }}
        </button>
      </form>

      <p class="text-center text-muted small mt-3 mb-0">
        Don't have an account? <a routerLink="/register">Register here</a>
      </p>
    </div>
  </div>
</div>
