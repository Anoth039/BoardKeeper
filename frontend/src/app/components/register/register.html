<div class="auth-wrapper d-flex justify-content-center align-items-center">
  <div class="card shadow-sm" style="width: 100%; max-width: 400px;">
    <div class="card-body p-4">
      <h4 class="card-title text-center mb-4">Create an Account</h4>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" formControlName="email" />
          <div class="text-danger small" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
            A valid email is required.
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" formControlName="password" />
          <div class="text-danger small" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
            Password must be at least 8 characters.
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Confirm Password</label>
          <input type="password" class="form-control" formControlName="confirmPassword" />
          <div class="text-danger small" *ngIf="form.errors?.['passwordsMismatch'] && form.get('confirmPassword')?.touched">
            Passwords do not match.
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Invite Code</label>
          <input type="text" class="form-control" formControlName="inviteCode" />
          <div class="text-danger small" *ngIf="form.get('inviteCode')?.invalid && form.get('inviteCode')?.touched">
            An invite code is required.
          </div>
        </div>

        <div class="alert alert-danger py-2" *ngIf="errorMessage">{{ errorMessage }}</div>
        <div class="alert alert-success py-2" *ngIf="successMessage">{{ successMessage }}</div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="submitting">
          {{ submitting ? 'Creating account...' : 'Register' }}
        </button>
      </form>

      <p class="text-center text-muted small mt-3 mb-0">
        Already have an account? <a routerLink="/login">Log in here</a>
      </p>
    </div>
  </div>
</div>
