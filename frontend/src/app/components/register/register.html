<div class="auth-wrapper d-flex justify-content-center align-items-center w-100">
  <div class="card shadow-sm" style="width: 100%; max-width: 420px;">
    <div class="card-body p-4">
      <h4 class="card-title text-center mb-4">Create an Account</h4>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <div class="mb-3">
          <label class="form-label">Email *</label>
          <div class="input-group">
            <input type="email" class="form-control border-end-0" formControlName="email"/>
            <button type="button" class="btn border border-start-0 bg-transparent text-primary small" (click)="sendCode()" [disabled]="!canSendCode || sendingCode">
              <span *ngIf="sendingCode" class="spinner-border spinner-border-sm me-1" role="status"></span>
              {{ sendingCode ? 'Sending...' : cooldownSeconds > 0 ? cooldownSeconds + 's' : codeSent ? 'Resend' : 'Send Code' }}
            </button>
          </div>
          <div class="text-danger small" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
            A valid email is required.
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Verification Code *</label>
          <input type="text" class="form-control text-center" style="letter-spacing: 0.3em; font-size: 1.1rem;"
            formControlName="verificationCode" maxlength="6" placeholder="000000"/>
          <div class="text-danger small" *ngIf="form.get('verificationCode')?.invalid && form.get('verificationCode')?.touched">
            Enter the 6-digit code from your email.
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Password *</label>
          <div class="input-group">
            <input [type]="showPassword ? 'text' : 'password'" class="form-control border-end-0" formControlName="password"/>
            <button type="button" class="btn border border-start-0 bg-transparent text-secondary" (click)="showPassword = !showPassword" tabindex="-1">
              <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
          <div class="text-danger small" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
            Password must be at least 8 characters.
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Confirm Password *</label>
          <div class="input-group">
            <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-control border-end-0" formControlName="confirmPassword" />
            <button type="button" class="btn border border-start-0 bg-transparent text-secondary" (click)="showConfirmPassword = !showConfirmPassword" tabindex="-1">
              <i class="bi" [ngClass]="showConfirmPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
          <div class="text-danger small" *ngIf="form.errors?.['passwordsMismatch'] && form.get('confirmPassword')?.touched">
            Passwords do not match.
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="submitting || form.invalid">
          {{ submitting ? 'Creating account...' : 'Register' }}
        </button>
      </form>

      <p class="text-center text-muted small mt-3 mb-0">
        Already have an account? <a routerLink="/login">Log in here</a>
      </p>
    </div>
  </div>
</div>
