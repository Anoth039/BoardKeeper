<nav class="navbar navbar-expand-lg navbar-dark mb-3">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/stats">
      <img src="logo.svg" alt="" width="30" height="30" class="brand-logo">
      <span>BoardKeeper</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
      aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/games" routerLinkActive="active">Games</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/members" routerLinkActive="active">Members</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/rentals" routerLinkActive="active">Rentals</a>
        </li>
        <li class="nav-item" *ngIf="can('users:manage')">
          <a class="nav-link" routerLink="/users" routerLinkActive="active">Users</a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-3 my-2">
        <div class="user-chip">
          <span class="avatar avatar-sm">{{ authService.getCurrentUser()?.email?.charAt(0) | uppercase }}</span>
          <span class="user-email">{{ authService.getCurrentUser()?.email }}</span>
          <span class="badge" [ngClass]="authService.getCurrentUser()?.role === 'admin' ? 'bg-danger' : 'bg-secondary'">
            {{ authService.getCurrentUser()?.role }}
          </span>
        </div>
        <button class="btn btn-sm btn-outline-light ms-auto" (click)="logout()">
          <i class="bi bi-box-arrow-right"></i> Logout
        </button>
      </div>
    </div>
  </div>
</nav>
